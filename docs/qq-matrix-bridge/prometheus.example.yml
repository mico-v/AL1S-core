# Prometheus 与 bridge 同主机时使用 127.0.0.1；若不在同一主机，改为 bridge 的
# 内网地址，不要把 /metrics 暴露到公网。
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - alerts.example.yml

scrape_configs:
  - job_name: al1s-matrix-bridge
    metrics_path: /metrics
    scheme: http
    static_configs:
      - targets:
          - 127.0.0.1:29328
        labels:
          service: al1s-matrix-bridge
