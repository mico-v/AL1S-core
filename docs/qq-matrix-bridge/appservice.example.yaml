id: al1s-qq-bridge
# 同一宿主机进程可使用 127.0.0.1；Tuwunel 容器访问宿主 bridge 时改为
# http://host.docker.internal:29328，并同时设置 bridge 监听 0.0.0.0。
url: http://127.0.0.1:29328
as_token: replace-with-a-random-as-token
hs_token: replace-with-a-different-random-hs-token
sender_localpart: _al1s_qq
# QQ 官方没有可靠的群聊 typing/receipt/presence 对称能力，保持关闭。
receive_ephemeral: false

namespaces:
  users:
    - exclusive: true
      regex: '^@_qq_[0-9a-f]{64}:matrix\.example$'
  aliases:
    - exclusive: true
      regex: '^#_qq_[0-9a-f]{64}:matrix\.example$'
  rooms: []
