name: al1s-qq-matrix

services:
  tuwunel:
    image: ghcr.io/matrix-construct/tuwunel@sha256:678b7f5350e06a41614444497c587da9dddf66767e4068a27480402f3c1367d0
    restart: unless-stopped
    stop_grace_period: 30m
    environment:
      TUWUNEL_SERVER_NAME: ${MATRIX_BRIDGE_DOMAIN:?set MATRIX_BRIDGE_DOMAIN in .env}
      TUWUNEL_DATABASE_PATH: /var/lib/tuwunel
      TUWUNEL_ADDRESS: 0.0.0.0
      TUWUNEL_PORT: "6167"
      TUWUNEL_APPSERVICE_DIR: /etc/tuwunel/appservices
      TUWUNEL_ALLOW_FEDERATION: "false"
      TUWUNEL_ALLOW_REGISTRATION: "false"
    ports:
      - "127.0.0.1:8008:6167"
    volumes:
      - tuwunel-data:/var/lib/tuwunel
      - ./appservice.yaml:/etc/tuwunel/appservices/al1s-qq-bridge.yaml:ro
    networks:
      - bridge

  bridge:
    build:
      context: ..
      dockerfile: Dockerfile
      args:
        NODE_BASE_IMAGE: ${NODE_BASE_IMAGE:-node:24.13.0-bookworm-slim@sha256:4660b1ca8b28d6d1906fd644abe34b2ed81d15434d26d845ef0aced307cf4b6f}
    image: al1s-core-bridge:local
    restart: unless-stopped
    init: true
    stop_grace_period: 45s
    env_file:
      - ../.env
    environment:
      MATRIX_BRIDGE_HOMESERVER_URL: http://tuwunel:6167
      MATRIX_BRIDGE_LISTEN_HOST: 0.0.0.0
      MATRIX_BRIDGE_DATA_FILE: /var/lib/al1s/state.json
    depends_on:
      tuwunel:
        condition: service_healthy
    volumes:
      - bridge-data:/var/lib/al1s
    networks:
      - bridge

volumes:
  tuwunel-data:
  bridge-data:

networks:
  bridge:
